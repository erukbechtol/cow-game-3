name: Build Cow Game 3 (DS/DSi)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install libnds and examples
        run: dkp-pacman -S --noconfirm --needed nds-dev nds-examples
      - name: Build using an official template Makefile
        run: |
          ls $DEVKITPRO/examples/nds/templates
          T=""
          for f in $(find $DEVKITPRO/examples/nds/templates -type f -name Makefile | sort); do
            case "$f" in *lib*) continue;; esac
            if grep -q 'nds' "$f"; then T=$f; break; fi
          done
          echo "Using template: $T"
          mkdir -p work && cp -r "$(dirname "$T")"/. work/
          mkdir -p work/source && rm -rf work/source/* && cp source/main.c work/source/
          make -C work
          find work -name '*.nds'
          cp "$(find work -name '*.nds' | head -n1)" cowgame3.nds
      - uses: actions/upload-artifact@v4
        with:
          name: cowgame3-ds
          path: cowgame3.nds
