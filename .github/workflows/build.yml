name: Build Cow Game 3 (DS/DSi)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert PNG assets to C bitmaps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev zlib1g-dev
          mkdir -p source/gfx /tmp/png2c_src

          cat <<'EOF' > /tmp/png2c_src/png2c.c
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <ctype.h>
          #include <zlib.h>

          static uint32_t read_be32(const uint8_t *p) {
              return ((uint32_t)p[0] << 24) |
                     ((uint32_t)p[1] << 16) |
                     ((uint32_t)p[2] << 8)  |
                     ((uint32_t)p[3]);
          }

          static int paeth(int a, int b, int c) {
              int p = a + b - c;
              int pa = abs(p - a);
              int pb = abs(p - b);
              int pc = abs(p - c);
              if (pa <= pb && pa <= pc) return a;
              if (pb <= pc) return b;
              return c;
          }

          static void basename_no_ext(const char *path, char *out, size_t out_sz) {
              const char *slash = strrchr(path, '/');
              const char *base = slash ? slash + 1 : path;
              const char *dot = strrchr(base, '.');
              size_t len = dot ? (size_t)(dot - base) : strlen(base);
              if (len >= out_sz) len = out_sz - 1;
              memcpy(out, base, len);
              out[len] = '\0';
          }

          static void to_upper_str(const char *src, char *dst, size_t dst_sz) {
              size_t i = 0;
              for (; src[i] && i + 1 < dst_sz; i++) {
                  dst[i] = (char)toupper((unsigned char)src[i]);
              }
              dst[i] = '\0';
          }

          static int convert_one(const char *png_path) {
              FILE *f = fopen(png_path, "rb");
              if (!f) {
                  fprintf(stderr, "Failed to open %s\n", png_path);
                  return 1;
              }
              if (fseek(f, 0, SEEK_END) != 0) { fclose(f); return 1; }
              long fsize = ftell(f);
              rewind(f);
              if (fsize < 24) { fclose(f); return 1; }

              uint8_t *file_buf = (uint8_t *)malloc((size_t)fsize);
              if (!file_buf) { fclose(f); return 1; }
              if (fread(file_buf, 1, (size_t)fsize, f) != (size_t)fsize) {
                  free(file_buf);
                  fclose(f);
                  return 1;
              }
              fclose(f);

              static const uint8_t sig[8] = {137, 80, 78, 71, 13, 10, 26, 10};
              if (memcmp(file_buf, sig, 8) != 0) {
                  fprintf(stderr, "%s is not a valid PNG\n", png_path);
                  free(file_buf);
                  return 1;
              }

              uint32_t w = 0, h = 0;
              uint8_t bit_depth = 0, color_type = 0;
              int got_ihdr = 0;

              uint8_t *idat_buf = NULL;
              size_t idat_len = 0;

              size_t pos = 8;
              while (pos + 12 <= (size_t)fsize) {
                  uint32_t chunk_len = read_be32(file_buf + pos);
                  const uint8_t *type_ptr = file_buf + pos + 4;
                  if (pos + 12 + (size_t)chunk_len > (size_t)fsize) {
                      fprintf(stderr, "Truncated chunk in %s\n", png_path);
                      free(idat_buf);
                      free(file_buf);
                      return 1;
                  }
                  const uint8_t *data_ptr = file_buf + pos + 8;

                  if (memcmp(type_ptr, "IHDR", 4) == 0) {
                      if (chunk_len < 13) {
                          free(idat_buf);
                          free(file_buf);
                          return 1;
                      }
                      w = read_be32(data_ptr);
                      h = read_be32(data_ptr + 4);
                      bit_depth = data_ptr[8];
                      color_type = data_ptr[9];
                      got_ihdr = 1;
                  } else if (memcmp(type_ptr, "IDAT", 4) == 0) {
                      uint8_t *next_idat = (uint8_t *)realloc(idat_buf, idat_len + chunk_len);
                      if (!next_idat) {
                          free(idat_buf);
                          free(file_buf);
                          return 1;
                      }
                      idat_buf = next_idat;
                      memcpy(idat_buf + idat_len, data_ptr, chunk_len);
                      idat_len += chunk_len;
                  } else if (memcmp(type_ptr, "IEND", 4) == 0) {
                      break;
                  }

                  pos += 12 + (size_t)chunk_len;
              }

              if (!got_ihdr || bit_depth != 8 || (color_type != 2 && color_type != 6) || !idat_buf) {
                  fprintf(stderr, "%s: unsupported PNG (depth=%u, type=%u)\n", png_path, bit_depth, color_type);
                  free(idat_buf);
                  free(file_buf);
                  return 1;
              }

              int bpp = (color_type == 6) ? 4 : 3;
              size_t stride = (size_t)w * (size_t)bpp;
              size_t raw_cap = (size_t)h * (stride + 1) + 64;
              uint8_t *raw = (uint8_t *)malloc(raw_cap);
              uLongf raw_len = (uLongf)raw_cap;

              while (1) {
                  int zres = uncompress(raw, &raw_len, idat_buf, (uLong)idat_len);
                  if (zres == Z_OK) break;
                  if (zres == Z_BUF_ERROR) {
                      raw_cap *= 2;
                      uint8_t *bigger = (uint8_t *)realloc(raw, raw_cap);
                      if (!bigger) {
                          free(raw);
                          free(idat_buf);
                          free(file_buf);
                          return 1;
                      }
                      raw = bigger;
                      raw_len = (uLongf)raw_cap;
                      continue;
                  }
                  fprintf(stderr, "%s: zlib uncompress failed (%d)\n", png_path, zres);
                  free(raw);
                  free(idat_buf);
                  free(file_buf);
                  return 1;
              }

              uint8_t *recon = (uint8_t *)calloc((size_t)h * stride + 1, 1);
              if (!recon) {
                  free(raw);
                  free(idat_buf);
                  free(file_buf);
                  return 1;
              }

              size_t idx = 0;
              for (uint32_t y = 0; y < h; y++) {
                  if (idx >= raw_len) {
                      fprintf(stderr, "%s: unexpected end of decompressed PNG data\n", png_path);
                      free(recon);
                      free(raw);
                      free(idat_buf);
                      free(file_buf);
                      return 1;
                  }
                  uint8_t ftype = raw[idx++];
                  size_t row_start = (size_t)y * stride;
                  size_t prev_start = (y > 0) ? ((size_t)(y - 1) * stride) : 0;

                  for (size_t x = 0; x < stride; x++) {
                      if (idx >= raw_len) {
                          free(recon);
                          free(raw);
                          free(idat_buf);
                          free(file_buf);
                          return 1;
                      }
                      int val = raw[idx++];
                      int a = (x >= (size_t)bpp) ? recon[row_start + x - (size_t)bpp] : 0;
                      int b = (y > 0) ? recon[prev_start + x] : 0;
                      int c = (y > 0 && x >= (size_t)bpp) ? recon[prev_start + x - (size_t)bpp] : 0;
                      int out = 0;

                      if (ftype == 0) out = val;
                      else if (ftype == 1) out = (val + a) & 0xFF;
                      else if (ftype == 2) out = (val + b) & 0xFF;
                      else if (ftype == 3) out = (val + ((a + b) >> 1)) & 0xFF;
                      else if (ftype == 4) out = (val + paeth(a, b, c)) & 0xFF;
                      else {
                          fprintf(stderr, "%s: unsupported PNG filter %u\n", png_path, ftype);
                          free(recon);
                          free(raw);
                          free(idat_buf);
                          free(file_buf);
                          return 1;
                      }
                      recon[row_start + x] = (uint8_t)out;
                  }
              }

              char name[128];
              char upper[128];
              basename_no_ext(png_path, name, sizeof(name));
              to_upper_str(name, upper, sizeof(upper));

              char h_path[256];
              char c_path[256];
              snprintf(h_path, sizeof(h_path), "source/gfx/%s.h", name);
              snprintf(c_path, sizeof(c_path), "source/gfx/%s.c", name);

              FILE *hf = fopen(h_path, "w");
              FILE *cf = fopen(c_path, "w");
              if (!hf || !cf) {
                  if (hf) fclose(hf);
                  if (cf) fclose(cf);
                  free(recon);
                  free(raw);
                  free(idat_buf);
                  free(file_buf);
                  return 1;
              }

              uint32_t total = w * h;
              fprintf(hf, "#pragma once\n");
              fprintf(hf, "#define %s_BITMAP_WIDTH %u\n", upper, w);
              fprintf(hf, "#define %s_BITMAP_HEIGHT %u\n", upper, h);
              fprintf(hf, "extern const unsigned short %sBitmap[%u];\n", name, total);

              fprintf(cf, "#include \"%s.h\"\n\n", name);
              fprintf(cf, "const unsigned short %sBitmap[%u] = {\n", name, total);

              for (uint32_t i = 0; i < total; i++) {
                  size_t p = (size_t)i * (size_t)bpp;
                  uint8_t r = recon[p];
                  uint8_t g = recon[p + 1];
                  uint8_t b = recon[p + 2];
                  uint8_t a = (bpp == 4) ? recon[p + 3] : 255;

                  uint16_t out_px = 0x0000;
                  if (a >= 128) {
                      uint16_t r5 = r >> 3;
                      uint16_t g5 = g >> 3;
                      uint16_t b5 = b >> 3;
                      out_px = (uint16_t)(0x8000 | (b5 << 10) | (g5 << 5) | r5);
                  }

                  if ((i % 12) == 0) fprintf(cf, "    ");
                  fprintf(cf, "0x%04X", out_px);
                  if (i + 1 < total) fprintf(cf, ",");
                  if ((i % 12) == 11 || i + 1 == total) fprintf(cf, "\n");
                  else fprintf(cf, " ");
              }

              fprintf(cf, "};\n");
              fclose(hf);
              fclose(cf);

              printf("Converted %s -> %s, %s (%ux%u)\n", png_path, h_path, c_path, w, h);

              free(recon);
              free(raw);
              free(idat_buf);
              free(file_buf);
              return 0;
          }

          int main(int argc, char **argv) {
              if (argc < 2) return 1;
              for (int i = 1; i < argc; i++) {
                  if (convert_one(argv[i]) != 0) return 1;
              }
              return 0;
          }
          EOF

          cc -O2 /tmp/png2c_src/png2c.c -lz -o /tmp/png2c_src/png2c
          /tmp/png2c_src/png2c graphics/*.png
          ls -la source/gfx

      - name: Build NDS ROM
        run: |
          export PATH="/opt/wonderful/bin:$PATH"
          if [ -f /opt/wonderful/env.sh ]; then
            . /opt/wonderful/env.sh
          fi
          pwd && ls -la
          make
          find . -maxdepth 3 -name "*.nds"

      - uses: actions/upload-artifact@v4
        with:
          name: cowgame3-ds
          path: |
            *.nds
            **/*.nds
            
