name: Build Cow Game 3 (DS/DSi)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Install libnds and examples
        run: dkp-pacman -S --noconfirm --needed nds-dev nds-examples
      - name: Build using the official template Makefile
        run: |
          T=$(find $DEVKITPRO/examples/nds -type f -name Makefile -ipath '*template*' | head -n1)
          echo "Using template: $T"
          mkdir -p work && cp -r "$(dirname "$T")"/. work/
          mkdir -p work/source && rm -rf work/source/* && cp source/main.c work/source/
          make -C work
          cp work/*.nds cowgame3.nds
      - uses: actions/upload-artifact@v4
        with:
          name: cowgame3-ds
          path: cowgame3.nds
